<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- canonical/og:url come from VITE_SITE_URL at build; title + description are injected
         from the live profile at request time. Generic fallbacks below for dev / no-JS. -->
    <link rel="canonical" href="%VITE_SITE_URL%" />
    <title>A résumé you can talk to</title>
    <meta name="description" content="A live, queryable résumé — ask questions, score a job's fit, and generate a tailored résumé." />
    <meta property="og:title" content="A résumé you can talk to" />
    <meta property="og:description" content="A live, queryable résumé — ask anything, score a job fit, generate a tailored résumé." />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta name="theme-color" content="#f5f2ea" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,560;0,6..72,600;1,6..72,400&family=Public+Sans:wght@400;500;550;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
